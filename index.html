function start(){top("SHANGHAI · PROLOGUE",1);$("app").innerHTML='<section class="screen"><div class="brand"><div>'+face("happy")+'</div><div class="logo">I<b>♥</b>SH</div><div class="sub">SHANGHAI · CHOICE GAME</div><p>2026.10.29 — 11.02</p></div><div class="story">'+face("sparkle")+'<div class="bubble">5일간의 상하이 여행입니다.<br>선택에 따라 다음 장소와 식사, 쇼핑이 달라집니다.</div></div><button class="btn primary" onclick="places()">여행 시작하기 <b>→</b></button></section>'}
function places(){top("10/29 · 첫 목적지",2);$("app").innerHTML='<section class="screen"><div class="k">DAY 1 · 10월 29일</div><h1>상하이에 도착했습니다.</h1><div class="story">'+face("happy")+'<div class="bubble">호텔 체크인을 마쳤습니다.<br>첫 목적지를 선택합니다.</div></div>'+["yu","nan","bund","xin"].map(x=>placeCard(x,"pickPlace")).join("")+'</section>'}
function pickPlace(id){S.place=id;S.prev=id;top("10/29 · 식사 선택",3);$("app").innerHTML='<section class="screen"><div class="k">CURRENT · '+P[id].name+'</div><h1>'+P[id].name+'을 둘러봤습니다.</h1><div class="story">'+face(id==="nan"?"sparkle":"happy")+'<div class="bubble">'+(id==="nan"?"구경할 곳이 많습니다. 쇼핑도 같이 둘러볼 수 있습니다.":"다음 목적지로 이동하기 전에 식사할 곳을 선택합니다.")+'</div></div><div class="tabs"><span class="tab on">추천</span><span class="tab">중식</span><span class="tab">딤섬</span><span class="tab">한식</span></div>'+F.filter(f=>f.near.includes(id)||f.near.includes("nan")).slice(0,8).map((f,i)=>foodCard(f,i<2)).join("")+'</section>'}
function foodCard(f,hot){return '<div class="food" onclick="pickFood(''+f.name+'')"><div class="thumb">'+f.emoji+'</div><div><h3>'+f.name+(hot?'<span class="badge">추천</span>':'')+'</h3><div class="meta">'+f.cn+' · '+f.type+'<br>식사 '+f.stay+' · 대기 '+f.wait+'</div><div class="choice">이 식당으로 선택 →</div></div></div>'}
function pickFood(n){S.meal=n;if(S.place==="nan"||S.place==="xin"){shopping()}else{day2()}}
function shopping(){top("10/29 · 쇼핑 선택",4);let list=SH.filter(s=>s.near.includes(S.place));$("app").innerHTML='<section class="screen"><div class="k">'+P[S.place].name+' · SHOPPING</div><h1>근처에서 기념품을 둘러봅니다.</h1><div class="story">'+face("love")+'<div class="bubble">'+(S.place==="nan"?"난징동루에는 대형 굿즈숍과 상하이 기념품 매장이 있습니다.":"신천지에서는 엽서와 문구, 디자인 소품을 둘러볼 수 있습니다.")+'</div></div>'+list.map(shopCard).join("")+'<button class="btn" onclick="day2()">쇼핑 없이 다음 장소로 이동 →</button></section>'}
function shopCard(s){return '<div class="shop" onclick="pickShop(''+s.name+'')"><div class="thumb">'+s.emoji+'</div><div><h3>'+s.name+'</h3><div class="meta">'+s.cn+' · 평균 '+s.time+'</div><div class="desc">'+s.desc+'</div><div class="choice">여기 들르기 →</div></div></div>'}
function pickShop(n){S.shop=n;day2()}
function day2(){top("10/30 · 다음 장면",5);S.prev=S.place||"hotel";$("app").innerHTML='<section class="screen"><div class="k">DAY 2 · 10월 30일</div><h1>다음 날의 큰 코스를 선택합니다.</h1><div class="story">'+face("sparkle")+'<div class="bubble">어제 선택한 장소를 기준으로 이동시간을 계산합니다.</div></div>'+["yu","nan","xin","tian","pearl","zhuj"].map(x=>placeCard(x,"pickDay2")).join("")+'</section>'}
function pickDay2(id){let from=S.prev;let r=(R[from]&&R[from][id])||R.hotel[id];S.prev=id;top("10/30 · 동선 확인",6);$("app").innerHTML='<section class="screen"><div class="k">ROUTE CHECK</div><h1>'+P[id].name+'을 선택했습니다.</h1><div class="story">'+face("happy")+'<div class="bubble">이동시간과 평균 체류시간을 일정에 반영합니다.</div></div><div class="sum"><h3>이동 정보</h3><div class="row"><span class="time">🚕 택시</span><span>'+r[0]+'</span></div><div class="row"><span class="time">🚇 대중교통</span><span>'+r[1]+'</span></div><div class="row"><span class="time">⏱ 체류</span><span>'+P[id].stay+'</span></div></div><button class="btn primary" onclick="meal2(''+id+'')">식사 선택하기 →</button></section>'}
function meal2(id){top("10/30 · 식사 & 쇼핑",7);$("app").innerHTML='<section class="screen"><div class="k">'+P[id].name+' · DINING</div><h1>다음 목적지까지 생각해서 선택합니다.</h1>'+F.filter(f=>f.near.includes(id)||f.near.includes("nan")).slice(0,9).map((f,i)=>foodCard(f,i<2)).join("")+'<div class="note">식사시간과 대기시간은 일정 계산에 포함됩니다.</div><button class="btn primary" onclick="final()">일정 완성하기 →</button></section>'}
function final(){top("FINAL · 나의 여행",8);$("app").innerHTML='<section class="screen"><div class="brand" style="min-height:210px"><div class="logo" style="font-size:65px">I<b>♥</b>SH</div><div class="sub">MY SHANGHAI ROUTE</div></div><div class="k">MY COURSE</div><h1>선택한 일정이 완성되었습니다.</h1><div class="sum"><h3>10/29 · 도착일</h3><div class="row"><span class="time">관광</span><span>'+P[S.place].name+'</span></div><div class="row"><span class="time">식사</span><span>'+S.meal+'</span></div><div class="row"><span class="time">쇼핑</span><span>'+ (S.shop||"선택하지 않음")+'</span></div></div><div class="sum"><h3>11/1 · 디즈니랜드</h3><div class="row"><span class="time">DAY</span><span>Atour 체크아웃 → Novotel Shanghai Clover → 상하이 디즈니랜드 종일</span></div><div class="row"><span class="time">NIGHT</span><span>호텔 복귀 → 배달 또는 근처 저녁</span></div></div><div class="sum"><h3>11/2 · 귀국일</h3><div class="row"><span class="time">AM</span><span>아침 → 체크아웃 → 짐 보관 → 상하이 야생동물원</span></div><div class="row"><span class="time">13:55</span><span>공항 이동 목표</span></div><div class="row"><span class="time">16:25</span><span>상하이 → 한국</span></div></div><button class="btn primary" onclick="start()">처음부터 다시 선택 →</button></section>'}
start();
</script></body></html>
